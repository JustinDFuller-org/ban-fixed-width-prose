name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/validate-release.mjs "$GITHUB_REF_NAME"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm version
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm 11.5.1 or newer is required")' "$npm_version"
      - name: Publish scoped package
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if ! npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            npm publish --access public
          fi
      - name: Smoke test published package
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          for attempt in $(seq 1 12); do
            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cd "$temp_dir"
          npm init --yes --silent
          npm install --ignore-scripts "${package_name}@${package_version}"
          "$temp_dir/node_modules/.bin/ban-fixed-width-prose" --version | grep -Fx "$package_version"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
